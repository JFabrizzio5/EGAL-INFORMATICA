version: "3.8"
services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    networks:
      - mqtt_network
    restart: unless-stopped
    # Especificar el archivo de configuración
    command: mosquitto -c /mosquitto/config/mosquitto.conf

networks:
  mqtt_network:
    driver: bridge