# Permitir conexiones anónimas
allow_anonymous true

# Listener para MQTT
listener 1883 0.0.0.0
protocol mqtt

# Listener para WebSockets
listener 9001 0.0.0.0
protocol websockets

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true