version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodbhotel
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mongo_network
    environment:
      - MONGO_INITDB_BIND_IP=0.0.0.0
    restart: always

networks:
  mongo_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
